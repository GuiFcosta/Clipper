services:
  postgres:
    image: postgres:17-alpine
    container_name: clipper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipper_user
      POSTGRES_PASSWORD: clipper_dev_password
      POSTGRES_DB: clipper_db
    ports:
      - "5432:5432"
    volumes:
      - clipper_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipper_user -d clipper_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clipper_pgdata:
